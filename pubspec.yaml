name: face_detector_app
description: "FaceDetector App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.4

dependencies:
  desktop_drop: ^0.7.1
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  get: ^4.7.3
  msix: ^3.18.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: "PuHui"
      fonts:
        - asset: fonts/AlibabaPuHuiTi-3-Regular.ttf
  assets:
    - assets/

msix_config:
  display_name: FaceDetector
  publisher_display_name: ZhouCheng
  identity_name: ZhouCheng.FaceDetector
  msix_version: 0.1.0.0
  logo_path: assets/icon.png
  trim_logo: false
  capabilities: internetClient
  languages: zh-cn, zh-tw, en-us
  publisher: 
  store: true